[project]
name = "devex-survey-cli"
version = "0.1.0"
description = "Design, validate, and analyze small developer experience surveys"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "hkypro" }]
keywords = ["developer-experience", "devex", "platform-engineering", "survey"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyyaml>=6.0,<7",
]

[project.scripts]
devex-survey = "devex_survey.cli:entrypoint"

[project.urls]
Repository = "https://github.com/hkypro/devex-survey-cli"
Issues = "https://github.com/hkypro/devex-survey-cli/issues"

[dependency-groups]
dev = [
  "mypy>=1.18,<3",
  "pytest>=9.0,<10",
  "ruff>=0.14,<1",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devex_survey"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
